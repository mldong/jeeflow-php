name: Demo Deploy
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy PHP demo
    runs-on: ubuntu-latest
    steps:
      # 流程定义用本仓 flows/ 副本（已入库），无需 checkout jeeflow-java
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          # Dockerfile.demo 构建上下文 = 本仓根（packages/ + demo-slim/ + flows/ + jeeflow-flows-dir.php）
          docker build -f Dockerfile.demo -t jeeflow-php-demo:latest .
      - name: Export image
        run: |
          docker save jeeflow-php-demo:latest -o jeeflow-php-demo.tar
          chmod 644 jeeflow-php-demo.tar
      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: jeeflow-php-demo.tar
          target: /java_projects/jeeflow/demo/
      - name: Load image and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /java_projects/jeeflow/demo
            docker load -i jeeflow-php-demo.tar
            # Stop and remove old container if exists
            docker stop jeeflow-php-demo 2>/dev/null && docker rm jeeflow-php-demo 2>/dev/null || true
            docker run -d --name jeeflow-php-demo --restart always -p 16084:8090 jeeflow-php-demo:latest
            rm -f jeeflow-php-demo.tar
            echo "✅ PHP demo deployed (port 16084->8090)"
