name: Demo Deploy
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy PHP demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jeeflow-php
        uses: actions/checkout@v4
        with:
          path: jeeflow-php
      - name: Build Docker image
        run: |
          docker build -f jeeflow-php/Dockerfile.demo -t jeeflow-php-demo:latest jeeflow-php/
      - name: Export image
        run: docker save jeeflow-php-demo:latest -o jeeflow-php-demo.tar
      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: jeeflow-php-demo.tar
          target: /java_projects/jeeflow/demo/
      - name: Load image and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /java_projects/jeeflow/demo
            docker load -i jeeflow-php-demo.tar
            docker-compose up -d jeeflow-php-demo
            rm -f jeeflow-php-demo.tar
            echo "✅ PHP demo deployed"
