name: Demo Deploy
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy PHP demo
    runs-on: ubuntu-latest
    steps:
      # PHP demo 依赖共享流程 JSON，需 checkout jeeflow-java
      - name: Checkout jeeflow-java
        uses: actions/checkout@v4
        with:
          repository: mldong/jeeflow-java
          path: jeeflow-java
      - name: Checkout jeeflow-php
        uses: actions/checkout@v4
        with:
          path: jeeflow-php
      - name: Build Docker image
        run: |
          # Dockerfile.demo 期望构建上下文包含 jeeflow-java/ 和 php 源码
          mkdir -p /tmp/demo-build
          cp -r jeeflow-php /tmp/demo-build/
          cp -r jeeflow-java /tmp/demo-build/
          docker build -f /tmp/demo-build/jeeflow-php/Dockerfile.demo -t jeeflow-php-demo:latest /tmp/demo-build/
      - name: Export image
        run: |
          docker save jeeflow-php-demo:latest -o jeeflow-php-demo.tar
          chmod 644 jeeflow-php-demo.tar
      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: jeeflow-php-demo.tar
          target: /java_projects/jeeflow/demo/
      - name: Load image and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /java_projects/jeeflow/demo
            docker load -i jeeflow-php-demo.tar
            # Stop and remove old container if exists
            docker stop jeeflow-php-demo 2>/dev/null && docker rm jeeflow-php-demo 2>/dev/null || true
            docker run -d --name jeeflow-php-demo --restart always -p 16084:8090 jeeflow-php-demo:latest
            rm -f jeeflow-php-demo.tar
            echo "✅ PHP demo deployed (port 16084->8090)"
